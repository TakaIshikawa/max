name: mining_operations

domain:
  name: mining_operations
  description: >-
    Mine planning, fleet utilization, worker safety inspections, maintenance
    coordination, environmental monitoring, material movement, and production
    reconciliation for mining operations.
  categories:
    - application
    - analytics_tool
    - automation
    - data_pipeline
    - integration
    - reporting_tool
    - workflow_tool
  target_user_types:
    - mine operations managers
    - dispatch supervisors
    - maintenance planners
    - safety teams
    - environmental compliance teams
  target_segments:
    - surface mines
    - underground mines
    - mineral processing operators
    - mining contractors
    - remote-site mining contractors
  workflows:
    - short interval control
    - shift production planning
    - haul fleet dispatch review
    - equipment maintenance coordination
    - safety inspection follow-up
    - environmental monitoring response
    - production variance reconciliation
  buyer_roles:
    - mine general manager
    - operations superintendent
    - maintenance superintendent
    - health safety and environment leader
  hard_constraints:
    - must prioritize worker safety, hazard controls, and high-risk equipment controls
    - must support environmental monitoring, permits, compliance evidence, and reporting obligations
    - must work in remote sites with limited connectivity and harsh conditions
    - must account for equipment reliability, maintenance windows, parts readiness, and production targets
  bad_idea_patterns:
    - production dashboard without shift actions, equipment context, variance accountability, or safety controls
    - fleet optimizer or equipment analytics disconnected from maintenance, parts readiness, and dispatch realities
    - environmental alert without accountable response and regulatory evidence
  good_idea_criteria:
    - improves safety execution, safe shift decisions, asset availability, or production variance visibility
    - connects mine plans, dispatch, maintenance, inspections, environmental evidence, and production records
    - supports supervisors with operational actions, not generic analytics

domain_quality:
  enabled: true
  min_score: 72.0
  scoring_dimensions:
    worker_safety:
      weight: 1.5
      description: Addresses inspections, hazards, incidents, permits, fatigue, equipment risk controls, and safety follow-up.
    asset_availability:
      weight: 1.4
      description: Improves fleet readiness, equipment uptime, dispatch readiness, maintenance coordination, and parts planning.
    environmental_compliance:
      weight: 1.3
      description: Preserves monitoring, permit, exceedance, response, disturbance, and reporting evidence.
    production_variance_visibility:
      weight: 1.3
      description: Explains gaps between plan, dispatch, material movement, constraints, and actual output.

sources:
  - adapter: github
    params:
      topics:
        - mining
        - fleet-management
        - industrial-iot
  - adapter: hackernews
    params:
      filter_keywords:
        - mining operations
        - mine safety
        - fleet utilization
        - industrial safety
  - adapter: reddit
    params:
      subreddits:
        - mining
        - heavyequipment

evaluation:
  weight_profile: default
  min_score: 58.0
