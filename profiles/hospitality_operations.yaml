name: hospitality_operations

domain:
  name: hospitality_operations
  description: >-
    Hotel operations, housekeeping coordination, maintenance requests, guest
    issue recovery, labor planning, revenue handoffs, service standards, and
    brand audit workflows.
  categories:
    - application
    - analytics_tool
    - automation
    - data_pipeline
    - integration
    - reporting_tool
    - workflow_tool
  target_user_types:
    - hotel general managers
    - housekeeping managers
    - front office teams
    - maintenance teams
    - revenue and operations leaders
  target_segments:
    - hotels
    - multi-property operators
    - hospitality management groups
    - branded hotel franchises
  workflows:
    - room turn coordination
    - maintenance request triage
    - guest issue recovery
    - labor schedule planning
    - revenue and operations handoff
    - shift handoff
    - brand-standard audit follow-up
  buyer_roles:
    - hotel general manager
    - regional operations director
    - VP of hospitality operations
    - ownership asset manager
  hard_constraints:
    - must protect guest privacy and staff access controls
    - must integrate with PMS, housekeeping, maintenance, or labor systems
    - must reflect service standards and property-specific operating procedures
    - must preserve brand-standard audit, incident evidence, and service recovery accountability
    - must support property-level and multi-property operational visibility with high-tempo shift handoffs
  bad_idea_patterns:
    - generic booking or review tool disconnected from property operations
    - guest sentiment dashboard without service recovery workflow
    - housekeeping board that ignores room status, maintenance blocks, staffing, labor constraints, and guest impact
  good_idea_criteria:
    - reduces guest-impacting delays, room downtime, service defects, or unresolved issues
    - improves service recovery with accountable handoffs, closure evidence, and brand-standard follow-up
    - improves labor efficiency without hiding quality or brand-standard failures
    - gives managers operational visibility across rooms, staff, maintenance, revenue, and guest recovery

domain_quality:
  enabled: true
  min_score: 69.0
  scoring_dimensions:
    guest_impact_reduction:
      weight: 1.5
      description: Reduces delays, service failures, room defects, unresolved guest issues, or reputation risk.
    service_recovery:
      weight: 1.4
      description: Tracks issue ownership, guest communication, escalation, compensation decisions, and closure.
    labor_efficiency:
      weight: 1.2
      description: Aligns staffing, room turns, maintenance work, task flow, and occupancy changes without sacrificing quality.
    operational_visibility:
      weight: 1.3
      description: Connects PMS status, housekeeping, maintenance, revenue, shift handoffs, live status, and audit evidence.

sources:
  - adapter: github
    params:
      topics:
        - hospitality
        - hotel-management
        - property-management
  - adapter: hackernews
    params:
      filter_keywords:
        - hotel operations
        - hospitality management
        - hospitality operations
        - housekeeping software
  - adapter: reddit
    params:
      subreddits:
        - TalesFromTheFrontDesk
        - askhotels
        - hospitality

evaluation:
  weight_profile: default
  min_score: 55.0
