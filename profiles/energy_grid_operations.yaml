name: energy_grid_operations

domain:
  name: energy_grid_operations
  description: >-
    Utility grid monitoring, outage restoration, asset inspection, vegetation
    management, distributed energy resource coordination, and regulatory
    reporting for electric grid operations.
  categories:
    - application
    - analytics_tool
    - automation
    - data_pipeline
    - integration
    - reporting_tool
    - workflow_tool
  target_user_types:
    - grid operators
    - outage managers
    - field crews
    - vegetation planners
    - regulatory reporting teams
  target_segments:
    - electric utilities
    - distribution system operators
    - municipal utilities
    - grid services contractors
  workflows:
    - outage triage and restoration
    - feeder and substation monitoring
    - asset inspection routing
    - vegetation work planning
    - DER interconnection coordination
    - reliability and compliance reporting
  buyer_roles:
    - VP of grid operations
    - distribution operations leader
    - utility compliance manager
    - asset management director
  hard_constraints:
    - must support safety-critical field and switching procedures
    - must preserve regulated reporting and reliability evidence
    - must respect critical infrastructure security and access controls
    - must improve operational resilience during outages and storms
  bad_idea_patterns:
    - generic outage dashboard without restoration workflow or crew readiness
    - DER analytics disconnected from feeder capacity and operating limits
    - inspection tool without safety, asset, or regulatory evidence
  good_idea_criteria:
    - accelerates safe outage restoration or asset risk reduction
    - connects grid state, field work, and compliance documentation
    - improves operational decisions beyond passive dashboard visibility

domain_quality:
  enabled: true
  min_score: 72.0
  scoring_dimensions:
    safety_controls:
      weight: 1.5
      description: Accounts for crew safety, switching risk, field hazards, and critical procedures.
    grid_reliability:
      weight: 1.5
      description: Improves outage containment, restoration time, asset health, or DER coordination.
    field_readiness:
      weight: 1.3
      description: Makes crew, material, access, and work package readiness explicit.
    compliance_traceability:
      weight: 1.3
      description: Preserves reliability, inspection, vegetation, and regulatory reporting evidence.

sources:
  - adapter: github
    params:
      topics:
        - energy
        - smart-grid
        - utility
  - adapter: hackernews
    params:
      filter_keywords:
        - grid operations
        - outage management
        - distributed energy resources
  - adapter: reddit
    params:
      subreddits:
        - energy
        - electricalengineering

evaluation:
  weight_profile: default
  min_score: 58.0
