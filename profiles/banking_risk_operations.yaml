name: banking_risk_operations

domain:
  name: banking_risk_operations
  description: >-
    Operational risk, model risk, policy exceptions, issue management,
    regulatory exams, control testing, remediation tracking, and evidence
    collection for banking risk teams.
  categories:
    - application
    - analytics_tool
    - automation
    - data_pipeline
    - integration
    - reporting_tool
    - workflow_tool
  target_user_types:
    - operational risk managers
    - model risk teams
    - control testers
    - policy owners
    - regulatory exam coordinators
  target_segments:
    - regional banks
    - large bank risk functions
    - credit unions
    - regulated fintech bank partners
  workflows:
    - risk and control self-assessment
    - model validation issue tracking
    - policy exception review
    - control testing evidence collection
    - regulatory exam response
    - remediation plan accountability
  buyer_roles:
    - chief risk officer
    - operational risk leader
    - head of model risk management
    - internal audit executive
  hard_constraints:
    - must preserve auditability for controls, issues, approvals, and evidence
    - must support regulatory expectations and defensible exam responses
    - must enforce data access controls for sensitive bank and customer information
    - must maintain governance over models, controls, policies, and remediation plans
  bad_idea_patterns:
    - risk dashboard without control evidence or accountable remediation
    - model risk score without validation findings and governance context
    - policy exception tracker detached from approvals, owners, and expiration dates
  good_idea_criteria:
    - reduces operational risk through evidence-backed control improvement
    - prioritizes issues by customer, regulatory, financial, and control impact
    - connects policies, controls, findings, owners, and remediation proof

domain_quality:
  enabled: true
  min_score: 72.0
  scoring_dimensions:
    control_traceability:
      weight: 1.5
      description: Links risks, controls, tests, exceptions, issues, owners, and evidence.
    regulatory_defensibility:
      weight: 1.4
      description: Supports clear audit trails, exam narratives, and policy-backed decisions.
    risk_prioritization:
      weight: 1.3
      description: Separates material risk reduction from generic status reporting.
    remediation_accountability:
      weight: 1.4
      description: Tracks owners, due dates, approvals, exceptions, and proof of closure.

sources:
  - adapter: github
    params:
      topics:
        - risk-management
        - grc
        - banking
  - adapter: hackernews
    params:
      filter_keywords:
        - banking risk
        - operational risk
        - model risk
  - adapter: reddit
    params:
      subreddits:
        - banking
        - fintech

evaluation:
  weight_profile: default
  min_score: 58.0
