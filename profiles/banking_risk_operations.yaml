name: banking_risk_operations

domain:
  name: banking_risk_operations
  description: >-
    Operational risk, model risk, policy exceptions, issue management,
    regulatory exams, control testing, evidence collection, and remediation
    accountability for banking operations.
  categories:
    - application
    - analytics_tool
    - automation
    - data_pipeline
    - integration
    - reporting_tool
    - workflow_tool
  target_user_types:
    - operational risk managers
    - model risk teams
    - control testers
    - compliance officers
    - issue owners
  target_segments:
    - regional banks
    - commercial banking risk teams
    - consumer lending operations
    - bank compliance and internal audit groups
  workflows:
    - policy exception intake
    - control testing and evidence review
    - operational loss event triage
    - model governance issue tracking
    - regulatory exam response
    - remediation milestone reporting
  buyer_roles:
    - chief risk officer
    - head of operational risk
    - compliance executive
    - internal audit leader
  hard_constraints:
    - must preserve auditability for controls, issues, and remediation evidence
    - must align with regulatory expectations and examination response workflows
    - must enforce data access controls for sensitive banking records
    - must support model, policy, and control governance ownership
  bad_idea_patterns:
    - risk heatmap without evidence, owner, or remediation workflow
    - policy exception tracker disconnected from controls and approvals
    - model risk summary that lacks validation and governance lineage
  good_idea_criteria:
    - reduces operational risk through prioritized accountable remediation
    - connects issues, controls, policies, evidence, and regulatory requests
    - improves defensibility of control testing or exam response

domain_quality:
  enabled: true
  min_score: 72.0
  scoring_dimensions:
    control_traceability:
      weight: 1.5
      description: Links risks, controls, tests, exceptions, evidence, and accountable owners.
    regulatory_defensibility:
      weight: 1.5
      description: Produces exam-ready records with clear rationale and governance history.
    risk_prioritization:
      weight: 1.3
      description: Focuses work on material risk exposure, severity, and business impact.
    remediation_accountability:
      weight: 1.4
      description: Tracks issue ownership, milestones, validation, and closure evidence.

sources:
  - adapter: github
    params:
      topics:
        - risk-management
        - compliance
        - banking
  - adapter: hackernews
    params:
      filter_keywords:
        - banking risk
        - operational risk
        - regulatory compliance
  - adapter: reddit
    params:
      subreddits:
        - banking
        - riskmanagement

evaluation:
  weight_profile: default
  min_score: 58.0
