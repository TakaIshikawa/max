name: public_safety_dispatch

domain:
  name: public_safety_dispatch
  description: >-
    Emergency call intake, CAD coordination, unit dispatch, mutual aid, incident
    documentation, responder safety handoffs, and after-action reporting.
  categories:
    - application
    - analytics_tool
    - automation
    - data_pipeline
    - integration
    - reporting_tool
    - workflow_tool
  target_user_types:
    - emergency dispatchers
    - dispatch supervisors
    - first responders
    - records teams
    - municipal public safety buyers
  target_segments:
    - municipal 911 centers
    - public safety answering points
    - fire and EMS dispatch centers
    - county emergency communications agencies
  workflows:
    - emergency call intake
    - CAD incident coordination
    - unit dispatch and status tracking
    - mutual aid coordination
    - incident documentation
    - after-action review
  buyer_roles:
    - emergency communications director
    - police or fire chief
    - municipal CIO
    - public safety operations leader
  hard_constraints:
    - must preserve dispatcher accountability and incident audit trails
    - must avoid unsafe autonomous dispatch or unreviewed response decisions
    - must integrate with CAD, RMS, radio, GIS, or alerting systems
    - must support safety-critical handoffs, privacy, and public records requirements
  bad_idea_patterns:
    - autonomous dispatch decisioning without trained human accountability
    - public safety analytics without CAD context or incident auditability
    - caller-facing automation that delays emergency response or escalation
  good_idea_criteria:
    - reduces response time or dispatcher workload while preserving control
    - improves responder safety through clear handoffs and situational context
    - creates auditable incident documentation and after-action evidence

domain_quality:
  enabled: true
  min_score: 74.0
  scoring_dimensions:
    response_time_impact:
      weight: 1.5
      description: Speeds call handling, unit assignment, escalation, or mutual aid coordination.
    safety_critical_handoffs:
      weight: 1.5
      description: Preserves accurate caller, location, hazard, unit, and responder context.
    auditability:
      weight: 1.4
      description: Maintains incident timelines, decisions, updates, and after-action records.
    integration_readiness:
      weight: 1.3
      description: Fits CAD, GIS, radio, RMS, alerting, and municipal IT constraints.

sources:
  - adapter: github
    params:
      topics:
        - public-safety
        - emergency-services
        - cad
  - adapter: hackernews
    params:
      filter_keywords:
        - public safety dispatch
        - emergency dispatch
        - computer aided dispatch
  - adapter: reddit
    params:
      subreddits:
        - 911dispatchers
        - ems

evaluation:
  weight_profile: default
  min_score: 60.0
