name: insurance_claims_operations

domain:
  name: insurance_claims_operations
  description: >-
    Insurance claims intake, coverage review, adjudication, fraud triage,
    reserving, documentation, vendor coordination, regulatory evidence,
    settlement workflow, and claim cycle-time operations.
  categories:
    - application
    - analytics_tool
    - automation
    - data_pipeline
    - integration
    - reporting_tool
    - workflow_tool
  target_user_types:
    - claims adjusters
    - claims supervisors
    - SIU and fraud investigators
    - reserving analysts
    - compliance teams
  target_segments:
    - property and casualty insurers
    - specialty insurers
    - third-party administrators
    - self-insured enterprise claims teams
  workflows:
    - first notice of loss intake
    - claim evidence collection
    - coverage and liability review
    - fraud triage
    - reserve review
    - regulatory complaint and audit response
    - settlement action tracking
  buyer_roles:
    - chief claims officer
    - claims operations director
    - special investigations leader
    - insurance compliance manager
  hard_constraints:
    - must preserve claim file evidence, decisions, auditability, and adjuster accountability
    - must support jurisdictional regulatory timelines, disclosures, documentation, and auditability
    - must protect claimant, medical, financial, policy, and policyholder data
    - must integrate with core claims, document, payment, and vendor systems
    - must keep human accountability for coverage, liability, and settlement decisions
  bad_idea_patterns:
    - claims chatbot or dashboard without adjudication workflow, claim file evidence, or adjuster ownership
    - fraud score without investigator context, explainable signals, and investigation workflow
    - cycle-time metric detached from coverage, reserve, leakage, and compliance decisions
  good_idea_criteria:
    - improves claim evidence completeness and adjuster decision quality
    - reduces leakage, rework, or avoidable claim cycle time
    - connects intake, policy, evidence, payments, vendors, settlement actions, and regulatory proof

domain_quality:
  enabled: true
  min_score: 72.0
  scoring_dimensions:
    claim_evidence_completeness:
      weight: 1.5
      description: Captures policy, loss, documentation, communication, vendor, settlement, and decision evidence.
    leakage_reduction:
      weight: 1.4
      description: Reduces overpayment, underpayment, fraud exposure, fraud loss, rework, missed recovery, or reserve errors.
    compliance_auditability:
      weight: 1.4
      description: Maintains regulatory timelines, notices, explanations, approvals, audit history, and claim file records.
    cycle_time_impact:
      weight: 1.2
      description: Shortens intake, review, investigation, and claim resolution while preserving fair, documented decisions.

sources:
  - adapter: github
    params:
      topics:
        - insurance
        - claims
        - insurtech
        - fraud-detection
  - adapter: hackernews
    params:
      filter_keywords:
        - insurance claims
        - claims processing
        - claims automation
        - fraud triage
  - adapter: reddit
    params:
      subreddits:
        - Insurance
        - insurancepros

evaluation:
  weight_profile: default
  min_score: 58.0
