name: insurance_claims_operations

domain:
  name: insurance_claims_operations
  description: >-
    Insurance claims intake, adjudication, fraud triage, reserving,
    documentation, vendor coordination, regulatory evidence, and cycle-time
    improvement workflows.
  categories:
    - application
    - analytics_tool
    - automation
    - data_pipeline
    - integration
    - reporting_tool
    - workflow_tool
  target_user_types:
    - claims adjusters
    - claims supervisors
    - fraud investigators
    - reserving analysts
    - compliance teams
  target_segments:
    - property and casualty insurers
    - workers compensation carriers
    - third-party administrators
    - specialty insurance claims teams
  workflows:
    - first notice of loss intake
    - coverage and liability review
    - fraud triage
    - reserve adjustment
    - document and evidence collection
    - vendor and repair coordination
    - regulatory complaint response
  buyer_roles:
    - chief claims officer
    - VP of claims operations
    - SIU leader
    - claims compliance director
  hard_constraints:
    - must preserve claim file auditability and decision rationale
    - must protect personally identifiable and sensitive claim information
    - must support jurisdiction-specific regulatory timelines and notices
    - must integrate with core claims, document, payment, and vendor systems
  bad_idea_patterns:
    - claim score without evidence, explainability, or adjuster workflow
    - document summarizer disconnected from coverage and liability decisions
    - fraud alerting tool without investigation accountability
  good_idea_criteria:
    - improves cycle time while preserving fair and documented decisions
    - reduces leakage through evidence-backed triage or adjudication
    - connects claim facts, documents, reserves, vendors, and compliance records

domain_quality:
  enabled: true
  min_score: 71.0
  scoring_dimensions:
    claim_evidence_completeness:
      weight: 1.5
      description: Captures documents, facts, photos, communications, and decision rationale.
    leakage_reduction:
      weight: 1.3
      description: Reduces overpayment, missed recovery, fraud loss, or avoidable expense.
    compliance_auditability:
      weight: 1.4
      description: Preserves regulatory notices, timelines, approvals, and claim file history.
    cycle_time_impact:
      weight: 1.2
      description: Improves intake, adjudication, vendor, or payment turnaround.

sources:
  - adapter: github
    params:
      topics:
        - insurance
        - claims
        - fraud-detection
  - adapter: hackernews
    params:
      filter_keywords:
        - insurance claims
        - claims automation
        - fraud triage
  - adapter: reddit
    params:
      subreddits:
        - insurance
        - insurancepros

evaluation:
  weight_profile: default
  min_score: 57.0
