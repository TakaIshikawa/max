name: insurance_claims_operations

domain:
  name: insurance_claims_operations
  description: >-
    Insurance claims intake, coverage review, adjudication, fraud triage,
    reserving, documentation, vendor coordination, regulatory evidence, and
    claim cycle-time workflows.
  categories:
    - application
    - analytics_tool
    - automation
    - data_pipeline
    - integration
    - reporting_tool
    - workflow_tool
  target_user_types:
    - claims adjusters
    - claims supervisors
    - fraud investigators
    - reserving analysts
    - compliance teams
  target_segments:
    - property and casualty insurers
    - specialty insurers
    - third-party administrators
    - self-insured enterprise claims teams
  workflows:
    - first notice of loss intake
    - claim evidence collection
    - coverage and liability review
    - fraud triage
    - reserve review
    - regulatory complaint and audit response
  buyer_roles:
    - chief claims officer
    - claims operations director
    - special investigations leader
    - insurance compliance manager
  hard_constraints:
    - must preserve claim file evidence, decisions, and adjuster accountability
    - must support regulatory timelines, disclosures, and auditability
    - must protect claimant, medical, financial, and policyholder data
    - must integrate with core claims, document, payment, and vendor systems
  bad_idea_patterns:
    - claims dashboard without adjudication workflow or evidence review
    - fraud score without investigator context and explainable signals
    - cycle-time metric detached from coverage, reserve, and compliance decisions
  good_idea_criteria:
    - improves claim evidence completeness and decision quality
    - reduces leakage, rework, or avoidable claim cycle time
    - connects intake, policy, evidence, payments, vendors, and regulatory proof

domain_quality:
  enabled: true
  min_score: 72.0
  scoring_dimensions:
    claim_evidence_completeness:
      weight: 1.5
      description: Captures policy, loss, documentation, communication, vendor, and decision evidence.
    leakage_reduction:
      weight: 1.3
      description: Reduces overpayment, underpayment, fraud exposure, rework, or missed recovery.
    compliance_auditability:
      weight: 1.4
      description: Maintains regulatory timelines, explanations, approvals, and claim file history.
    cycle_time_impact:
      weight: 1.2
      description: Shortens claim resolution while preserving fair, documented decisions.

sources:
  - adapter: github
    params:
      topics:
        - insurance
        - claims
        - fraud-detection
  - adapter: hackernews
    params:
      filter_keywords:
        - insurance claims
        - claims automation
        - fraud triage
  - adapter: reddit
    params:
      subreddits:
        - Insurance
        - insurancepros

evaluation:
  weight_profile: default
  min_score: 58.0
