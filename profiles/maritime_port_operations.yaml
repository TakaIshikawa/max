name: maritime_port_operations

domain:
  name: maritime_port_operations
  description: >-
    Berth planning, terminal operations, drayage coordination, customs handoffs,
    vessel schedule changes, yard visibility, and port throughput management.
  categories:
    - application
    - analytics_tool
    - automation
    - data_pipeline
    - integration
    - reporting_tool
    - workflow_tool
  target_user_types:
    - terminal operations managers
    - berth planners
    - yard supervisors
    - drayage coordinators
    - customs and compliance teams
  target_segments:
    - marine terminal operators
    - port authorities
    - ocean carriers
    - drayage and intermodal coordinators
  workflows:
    - berth window planning
    - vessel arrival change management
    - container yard allocation
    - terminal gate appointment coordination
    - drayage handoff tracking
    - customs release and hold management
  buyer_roles:
    - terminal operations director
    - port authority operations leader
    - head of intermodal operations
    - logistics compliance manager
  hard_constraints:
    - must coordinate multiple parties across vessel, terminal, yard, gate, and customs events
    - must preserve compliance and release evidence for regulated cargo movement
    - must account for schedule volatility, equipment constraints, and yard congestion
    - must integrate with TOS, AIS, appointment, EDI, or customs systems
  bad_idea_patterns:
    - generic logistics tracker without berth, vessel, yard, or terminal context
    - visibility dashboard without schedule exception workflow
    - drayage tool disconnected from customs status and terminal appointments
  good_idea_criteria:
    - improves berth, vessel, yard, or gate schedule resilience
    - coordinates carrier, terminal, drayage, customs, and port stakeholders
    - increases operational throughput while preserving compliance evidence

domain_quality:
  enabled: true
  min_score: 71.0
  scoring_dimensions:
    schedule_resilience:
      weight: 1.5
      description: Handles vessel delays, berth conflicts, yard congestion, and gate changes.
    multi_party_coordination:
      weight: 1.4
      description: Connects terminal, carrier, drayage, customs, and port authority handoffs.
    compliance_evidence:
      weight: 1.3
      description: Preserves customs release, holds, inspections, and cargo movement evidence.
    operational_throughput:
      weight: 1.4
      description: Improves berth productivity, yard turns, gate flow, or dwell-time reduction.

sources:
  - adapter: github
    params:
      topics:
        - maritime
        - port-operations
        - logistics
  - adapter: hackernews
    params:
      filter_keywords:
        - port operations
        - maritime logistics
        - container terminal
  - adapter: reddit
    params:
      subreddits:
        - shipping
        - logistics

evaluation:
  weight_profile: default
  min_score: 57.0
