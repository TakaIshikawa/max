name: telecom_network_operations

domain:
  name: telecom_network_operations
  description: >-
    Telecom NOC workflows, incident triage, topology-aware outage response,
    capacity planning, field dispatch, SLA reporting, maintenance windows,
    change-risk coordination, and network reliability operations.
  categories:
    - application
    - analytics_tool
    - automation
    - data_pipeline
    - integration
    - reporting_tool
    - workflow_tool
  target_user_types:
    - NOC engineers
    - telecom operators
    - network operations managers
    - field operations teams
    - network planners
    - enterprise network service managers
  target_segments:
    - telecom operators
    - broadband providers
    - managed network service providers
    - enterprise network operations teams
  workflows:
    - network incident triage
    - outage containment
    - alarm correlation
    - topology-aware impact analysis
    - capacity planning
    - field dispatch coordination
    - SLA and maintenance reporting
    - maintenance window and change-risk review
  buyer_roles:
    - VP of network operations
    - NOC director
    - field operations director
    - enterprise service assurance leader
  hard_constraints:
    - must preserve topology, alarm, outage, change, SLA, customer-impact, and remediation evidence
    - must integrate with NMS, OSS, ticketing, inventory, topology, and field dispatch systems
    - must account for network redundancy, maintenance windows, escalation reliability, and customer commitments
    - must protect operational access, network security, sensitive topology data, customer data, and change governance
  bad_idea_patterns:
    - generic uptime or incident dashboard without topology, alarm context, incident ownership, or SLA evidence
    - alert summarizer disconnected from field dispatch and customer impact
    - capacity chart without change-risk, redundancy, field constraints, and maintenance planning context
  good_idea_criteria:
    - contains outages faster through topology-aware triage and accountable handoffs
    - improves SLA evidence, customer impact analysis, remediation proof, or change-risk coordination
    - connects NOC alerts, topology, tickets, field work, service commitments, and customer-impact records

domain_quality:
  enabled: true
  min_score: 72.0
  scoring_dimensions:
    outage_containment:
      weight: 1.5
      description: Speeds detection, impact analysis, triage, escalation, restoration, and recovery.
    topology_awareness:
      weight: 1.5
      description: Uses circuit, node, customer, dependency, service-impact, redundancy, and inventory context.
    sla_evidence:
      weight: 1.3
      description: Preserves customer impact, timing, downtime, root cause, remediation, and service commitment records.
    operational_handoff_quality:
      weight: 1.3
      description: Improves NOC-to-field, engineering, vendor, customer support, and change-management handoffs.

sources:
  - adapter: github
    params:
      topics:
        - telecom
        - network-operations
        - observability
  - adapter: hackernews
    params:
      filter_keywords:
        - telecom operations
        - network operations
        - network outage
        - NOC
  - adapter: reddit
    params:
      subreddits:
        - networking
        - telecom

evaluation:
  weight_profile: default
  min_score: 58.0
