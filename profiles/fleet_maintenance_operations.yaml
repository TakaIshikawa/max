name: fleet_maintenance_operations

domain:
  name: fleet_maintenance_operations
  description: >-
    Vehicle inspection, preventive maintenance, defect triage, parts
    availability, downtime management, technician scheduling, dispatch
    readiness, and compliance records for fleet maintenance operations.
  categories:
    - application
    - analytics_tool
    - automation
    - data_pipeline
    - integration
    - reporting_tool
    - workflow_tool
  target_user_types:
    - fleet managers
    - maintenance supervisors
    - technicians
    - dispatch coordinators
    - compliance stakeholders
  target_segments:
    - commercial fleets
    - delivery fleets
    - municipal fleets
    - trucking operators
    - field service organizations
  workflows:
    - daily vehicle inspections
    - preventive maintenance planning
    - driver vehicle inspection review
    - defect and downtime triage
    - parts inventory coordination
    - technician scheduling
    - compliance record management
  buyer_roles:
    - director of fleet operations
    - maintenance operations leader
    - transportation compliance manager
    - logistics operations executive
  hard_constraints:
    - must preserve vehicle inspection, repair, and compliance evidence
    - must account for safety-critical defects, out-of-service rules, vehicle availability, and dispatch commitments
    - must integrate with telematics, maintenance, work order, dispatch, or parts systems
    - must support safety-critical defect escalation and repair signoff
  bad_idea_patterns:
    - fleet dashboard without repair workflow, work orders, or technician ownership
    - predictive maintenance score disconnected from downtime triage, parts readiness, and shop capacity
    - inspection checklist that does not create traceable defect resolution and compliance history
  good_idea_criteria:
    - improves asset uptime, safety compliance, or dispatch readiness
    - connects inspections, work orders, parts, technicians, signoffs, and vehicle availability
    - reduces unsafe vehicle use, avoidable breakdowns, and maintenance cycle time

domain_quality:
  enabled: true
  min_score: 70.0
  scoring_dimensions:
    asset_uptime:
      weight: 1.5
      description: Improves vehicle availability, downtime triage, preventive planning, and maintenance prioritization.
    safety_compliance:
      weight: 1.4
      description: Preserves inspection, defect, repair, and regulatory evidence while escalating safety-critical defects.
    maintenance_evidence:
      weight: 1.3
      description: Links inspections, diagnostics, work orders, technician notes, parts, approvals, and signoff history.
    parts_readiness:
      weight: 1.2
      description: Accounts for parts availability, shop capacity, routing impact, replacement options, and dispatch commitments.

sources:
  - adapter: github
    params:
      topics:
        - fleet-management
        - maintenance
        - telematics
  - adapter: hackernews
    params:
      filter_keywords:
        - fleet maintenance
        - vehicle inspection
        - preventive maintenance
        - telematics
  - adapter: reddit
    params:
      subreddits:
        - fleet
        - logistics
        - trucking
        - mechanics

evaluation:
  weight_profile: default
  min_score: 56.0
